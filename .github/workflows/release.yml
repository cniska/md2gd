name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: linux-x64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: bun install --frozen-lockfile
      - name: Check
        if: matrix.target == 'linux-x64'
        run: bun run check
      - name: Audit
        if: matrix.target == 'linux-x64'
        run: bun run audit
      - name: Build binary
        run: bun build --compile src/cli.ts --outfile md2gd
      - name: Smoke test binary
        run: bash scripts/smoke-compiled.sh
      - name: Package artifact
        run: |
          mkdir -p artifacts
          tar -czf artifacts/md2gd-${{ matrix.target }}.tar.gz md2gd
          cd artifacts && shasum -a 256 md2gd-${{ matrix.target }}.tar.gz > md2gd-${{ matrix.target }}.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: md2gd-${{ matrix.target }}
          path: artifacts/

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Prepare source archives
        run: |
          git archive --format=tar.gz --output=artifacts/md2gd-source-${GITHUB_REF_NAME}.tar.gz HEAD
          git archive --format=zip --output=artifacts/md2gd-source-${GITHUB_REF_NAME}.zip HEAD
      - name: Generate checksums
        run: cd artifacts && shasum -a 256 *.tar.gz *.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true
